name: Opportunity Discovery CI

on:
  push:
    paths:
      - "opportunity-discovery-intelligence/**"
      - ".github/workflows/opportunity-discovery-ci.yml"
  pull_request:
    paths:
      - "opportunity-discovery-intelligence/**"
      - ".github/workflows/opportunity-discovery-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r opportunity-discovery-intelligence/requirements.txt

      - name: Run discovery-engine tests
        working-directory: opportunity-discovery-intelligence
        run: |
          python -m unittest discover -s tests -v
